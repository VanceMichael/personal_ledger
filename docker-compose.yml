version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ledger
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+8:00

  backend:
    build: ./backend
    container_name: ledger-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ledger
      DB_USERNAME: root
      DB_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    container_name: ledger-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql-data:
